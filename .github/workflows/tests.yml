name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[demo]'
      - run: python -m unittest discover -s tests -v
      - run: python Demo/run_demo.py --iterations 15 --grid 300 --steps 50 --burnin 10 --thin 2 --evaluation-grid 1000
